openapi: 3.0.3

info:
  title: Payment API
  version: 1.0.0
  description: >
    API dùng để thực hiện thanh toán cho một chuyến đi
    trong hệ thống CAB bằng tiền mặt hoặc thanh toán điện tử.

servers:
  - url: http://localhost:3000/api
    description: Local development server

paths:
  /trips/{tripId}/payments:
    post:
      tags:
        - Payments

      summary: Thanh toán chuyến đi

      description: >
        Cho phép Customer thực hiện thanh toán cho Trip.
        Hệ thống hỗ trợ thanh toán tiền mặt hoặc thanh toán điện tử.
        Thông tin thanh toán nhạy cảm không được lưu trực tiếp trong hệ thống.

      security:
        - bearerAuth: []

      parameters:
        - name: tripId
          in: path
          required: true
          description: ID của chuyến đi cần thanh toán
          schema:
            type: string
          example: TRIP001

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object

              required:
                - method

              properties:
                method:
                  type: string
                  description: Phương thức thanh toán
                  enum:
                    - CASH
                    - ELECTRONIC
                  example: ELECTRONIC

      responses:

        '201':
          description: Tạo giao dịch thanh toán thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentId:
                    type: string
                    example: PAY001

                  tripId:
                    type: string
                    example: TRIP001

                  method:
                    type: string
                    enum:
                      - CASH
                      - ELECTRONIC
                    example: ELECTRONIC

                  amount:
                    type: number
                    format: double
                    example: 85000

                  status:
                    type: string
                    example: SUCCESS

                  message:
                    type: string
                    example: Thanh toán chuyến đi thành công

        '400':
          description: Thông tin thanh toán không hợp lệ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Phương thức thanh toán không hợp lệ

        '401':
          description: Người dùng chưa đăng nhập hoặc token không hợp lệ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Người dùng chưa được xác thực

        '404':
          description: Không tìm thấy Trip
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Không tìm thấy chuyến đi

        '409':
          description: Trip chưa đủ điều kiện để thanh toán
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Chuyến đi chưa hoàn thành hoặc đã được thanh toán

        '502':
          description: Payment Provider xử lý thanh toán thất bại
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Không thể xử lý thanh toán điện tử

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

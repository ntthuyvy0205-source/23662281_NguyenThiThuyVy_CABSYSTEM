openapi: 3.0.3

info:
  title: Driver Location API
  version: 1.0.0
  description: >
    API dùng để Driver cập nhật vị trí hiện tại
    trong hệ thống CAB.

servers:
  - url: http://localhost:3000/api
    description: Local development server

paths:
  /drivers/me/location:
    put:
      tags:
        - Drivers

      summary: Cập nhật vị trí Driver

      description: >
        Cho phép Driver gửi vị trí hiện tại của mình.
        Hệ thống sử dụng dữ liệu vị trí để hỗ trợ
        việc tìm và phân công Driver phù hợp.

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object

              required:
                - latitude
                - longitude

              properties:
                latitude:
                  type: number
                  format: double
                  description: Vĩ độ hiện tại của Driver
                  example: 10.8506

                longitude:
                  type: number
                  format: double
                  description: Kinh độ hiện tại của Driver
                  example: 106.7719

      responses:

        '200':
          description: Cập nhật vị trí Driver thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  driverId:
                    type: string
                    example: D001

                  latitude:
                    type: number
                    format: double
                    example: 10.8506

                  longitude:
                    type: number
                    format: double
                    example: 106.7719

                  updatedAt:
                    type: string
                    format: date-time
                    example: "2026-09-13T16:30:00+07:00"

                  message:
                    type: string
                    example: Cập nhật vị trí Driver thành công

        '400':
          description: Dữ liệu vị trí không hợp lệ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Tọa độ vị trí không hợp lệ

        '401':
          description: Driver chưa đăng nhập hoặc token không hợp lệ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Người dùng chưa được xác thực

        '403':
          description: Người dùng không có quyền cập nhật vị trí Driver
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Chỉ Driver được phép cập nhật vị trí

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

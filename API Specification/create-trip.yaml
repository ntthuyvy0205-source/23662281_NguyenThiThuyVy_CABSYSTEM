openapi: 3.0.3

info:
  title: Create Trip API
  version: 1.0.0
  description: >
    API dùng để tạo yêu cầu đặt xe mới trong hệ thống CAB.
    Customer cung cấp điểm đón, điểm đến và loại xe mong muốn.

servers:
  - url: http://localhost:3000/api
    description: Local development server

paths:
  /trips:
    post:
      tags:
        - Trips

      summary: Tạo yêu cầu đặt xe

      description: >
        Cho phép Customer tạo một yêu cầu đặt xe mới.
        Sau khi yêu cầu được tạo, hệ thống bắt đầu tìm Driver phù hợp.

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object

              required:
                - pickupLocation
                - destinationLocation
                - vehicleTypeId

              properties:
                pickupLocation:
                  type: object
                  description: Thông tin điểm đón
                  required:
                    - address
                    - latitude
                    - longitude
                  properties:
                    address:
                      type: string
                      example: 1 Vo Van Ngan, Thu Duc, Ho Chi Minh City
                    latitude:
                      type: number
                      format: double
                      example: 10.8506
                    longitude:
                      type: number
                      format: double
                      example: 106.7719

                destinationLocation:
                  type: object
                  description: Thông tin điểm đến
                  required:
                    - address
                    - latitude
                    - longitude
                  properties:
                    address:
                      type: string
                      example: Ben Thanh Market, Ho Chi Minh City
                    latitude:
                      type: number
                      format: double
                      example: 10.7725
                    longitude:
                      type: number
                      format: double
                      example: 106.6980

                vehicleTypeId:
                  type: string
                  description: ID loại xe Customer lựa chọn
                  example: VT001

      responses:

        '201':
          description: Tạo yêu cầu đặt xe thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  tripId:
                    type: string
                    example: TRIP001

                  customerId:
                    type: string
                    example: C001

                  vehicleTypeId:
                    type: string
                    example: VT001

                  status:
                    type: string
                    example: SEARCHING_DRIVER

                  message:
                    type: string
                    example: Tạo yêu cầu đặt xe thành công

        '400':
          description: Thông tin đặt xe không hợp lệ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Điểm đón hoặc điểm đến không hợp lệ

        '401':
          description: Người dùng chưa đăng nhập hoặc token không hợp lệ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Người dùng chưa được xác thực

        '409':
          description: Customer đang có một Trip hoạt động
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Customer đã có một chuyến đi đang hoạt động

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

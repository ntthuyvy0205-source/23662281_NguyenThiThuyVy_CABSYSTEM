openapi: 3.0.3

info:
  title: Rating API
  version: 1.0.0
  description: >
    API dùng để Customer đánh giá Driver sau khi chuyến đi
    đã hoàn thành trong hệ thống CAB.

servers:
  - url: http://localhost:3000/api
    description: Local development server

paths:
  /trips/{tripId}/ratings:
    post:
      tags:
        - Ratings

      summary: Đánh giá Driver

      description: >
        Cho phép Customer đánh giá Driver sau khi Trip hoàn thành.
        Mỗi Trip chỉ có tối đa một Rating chính thức.

      security:
        - bearerAuth: []

      parameters:
        - name: tripId
          in: path
          required: true
          description: ID của chuyến đi cần đánh giá
          schema:
            type: string
          example: TRIP001

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object

              required:
                - score

              properties:
                score:
                  type: integer
                  minimum: 1
                  maximum: 5
                  description: Số điểm đánh giá Driver từ 1 đến 5
                  example: 5

                comment:
                  type: string
                  description: Nội dung nhận xét về Driver
                  example: Tài xế thân thiện và lái xe an toàn

      responses:

        '201':
          description: Đánh giá Driver thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  ratingId:
                    type: string
                    example: RATE001

                  tripId:
                    type: string
                    example: TRIP001

                  customerId:
                    type: string
                    example: C001

                  driverId:
                    type: string
                    example: D001

                  score:
                    type: integer
                    example: 5

                  comment:
                    type: string
                    example: Tài xế thân thiện và lái xe an toàn

                  message:
                    type: string
                    example: Đánh giá Driver thành công

        '400':
          description: Dữ liệu đánh giá không hợp lệ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Điểm đánh giá phải nằm trong khoảng từ 1 đến 5

        '401':
          description: Customer chưa đăng nhập hoặc token không hợp lệ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Người dùng chưa được xác thực

        '403':
          description: Người dùng không có quyền đánh giá Trip này
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Bạn không có quyền đánh giá chuyến đi này

        '404':
          description: Không tìm thấy Trip
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Không tìm thấy chuyến đi

        '409':
          description: Trip chưa hoàn thành hoặc đã được đánh giá
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Chuyến đi chưa hoàn thành hoặc đã có đánh giá

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

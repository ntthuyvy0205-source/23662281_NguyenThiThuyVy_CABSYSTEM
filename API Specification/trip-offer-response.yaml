openapi: 3.0.3

info:
  title: Trip Offer Response API
  version: 1.0.0
  description: >
    API dùng để Driver phản hồi một yêu cầu nhận chuyến
    trong hệ thống CAB bằng cách chấp nhận hoặc từ chối chuyến.

servers:
  - url: http://localhost:3000/api
    description: Local development server

paths:
  /trip-offers/{offerId}/response:
    post:
      tags:
        - Drivers

      summary: Phản hồi yêu cầu nhận chuyến

      description: >
        Cho phép Driver chấp nhận hoặc từ chối một Trip Offer.
        Nếu Driver chấp nhận, hệ thống có thể phân công Driver
        cho Trip. Nếu Driver từ chối, hệ thống tiếp tục tìm
        Driver phù hợp khác.

      security:
        - bearerAuth: []

      parameters:
        - name: offerId
          in: path
          required: true
          description: ID của yêu cầu nhận chuyến
          schema:
            type: string
          example: OFFER001

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object

              required:
                - response

              properties:
                response:
                  type: string
                  description: Phản hồi của Driver
                  enum:
                    - ACCEPT
                    - REJECT
                  example: ACCEPT

      responses:

        '200':
          description: Ghi nhận phản hồi của Driver thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  offerId:
                    type: string
                    example: OFFER001

                  tripId:
                    type: string
                    example: TRIP001

                  driverId:
                    type: string
                    example: D001

                  response:
                    type: string
                    enum:
                      - ACCEPT
                      - REJECT
                    example: ACCEPT

                  message:
                    type: string
                    example: Driver đã chấp nhận chuyến đi

        '400':
          description: Phản hồi không hợp lệ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Giá trị response không hợp lệ

        '401':
          description: Driver chưa đăng nhập hoặc token không hợp lệ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Người dùng chưa được xác thực

        '403':
          description: Người dùng không có quyền phản hồi Trip Offer
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Chỉ Driver được phép phản hồi yêu cầu chuyến

        '404':
          description: Không tìm thấy Trip Offer
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Không tìm thấy yêu cầu nhận chuyến

        '409':
          description: Trip Offer không còn hiệu lực
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Yêu cầu nhận chuyến không còn hiệu lực

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

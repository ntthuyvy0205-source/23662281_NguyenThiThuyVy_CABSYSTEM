openapi: 3.0.3

info:
  title: Register API
  version: 1.0.0
  description: >
    API dùng để đăng ký tài khoản mới cho hệ thống CAB.
    API hỗ trợ tạo tài khoản Customer hoặc Driver.

servers:
  - url: http://localhost:3000/api
    description: Local development server

paths:
  /auth/register:
    post:
      tags:
        - Authentication

      summary: Đăng ký tài khoản

      description: >
        Cho phép người dùng tạo tài khoản mới bằng họ tên,
        số điện thoại, email và mật khẩu.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object

              required:
                - fullName
                - phone
                - password
                - accountType

              properties:
                fullName:
                  type: string
                  description: Họ và tên người dùng
                  example: Nguyen Van A

                phone:
                  type: string
                  description: Số điện thoại dùng để đăng ký
                  example: "0901234567"

                email:
                  type: string
                  format: email
                  description: Email của người dùng
                  example: nguyenvana@gmail.com

                password:
                  type: string
                  format: password
                  description: Mật khẩu tài khoản
                  example: Abc@123456

                accountType:
                  type: string
                  description: Loại tài khoản đăng ký
                  enum:
                    - CUSTOMER
                    - DRIVER
                  example: CUSTOMER

      responses:

        '201':
          description: Đăng ký tài khoản thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    example: U001

                  fullName:
                    type: string
                    example: Nguyen Van A

                  phone:
                    type: string
                    example: "0901234567"

                  accountType:
                    type: string
                    example: CUSTOMER

                  message:
                    type: string
                    example: Đăng ký tài khoản thành công

        '400':
          description: Dữ liệu đăng ký không hợp lệ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Thông tin đăng ký không hợp lệ

        '409':
          description: Số điện thoại hoặc email đã tồn tại
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Số điện thoại đã được sử dụng

openapi: 3.0.3

info:
  title: Get Available Drivers API
  description: >
    API cho phép Customer xem danh sách Driver đang AVAILABLE
    và có Vehicle phù hợp với VehicleType đã chọn.
    API này đáp ứng Functional Requirements FR18 và FR19.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server

tags:
  - name: Driver
    description: Các API liên quan đến Driver.

paths:
  /drivers/available:
    get:
      tags:
        - Driver
      summary: Xem danh sách Driver khả dụng
      description: >
        Customer đã đăng nhập có thể xem danh sách Driver
        đang ở trạng thái AVAILABLE và có Vehicle phù hợp
        với VehicleType đã chọn.
      operationId: getAvailableDrivers

      security:
        - bearerAuth: []

      parameters:
        - name: vehicleTypeId
          in: query
          required: true
          description: ID của loại xe Customer đã chọn.
          schema:
            type: string
          example: VT001

      responses:
        '200':
          description: Lấy danh sách Driver khả dụng thành công.
          content:
            application/json:
              schema:
                type: object
                properties:
                  vehicleTypeId:
                    type: string

                  drivers:
                    type: array
                    items:
                      $ref: '#/components/schemas/AvailableDriver'

              example:
                vehicleTypeId: VT001
                drivers:
                  - driverId: DRV001
                    fullName: Tran Van B
                    availabilityStatus: AVAILABLE
                    vehicle:
                      vehicleId: VEH001
                      vehicleTypeId: VT001
                      licensePlate: "51A-12345"
                      brand: Toyota
                      model: Vios
                      status: ACTIVE

                  - driverId: DRV002
                    fullName: Le Van C
                    availabilityStatus: AVAILABLE
                    vehicle:
                      vehicleId: VEH002
                      vehicleTypeId: VT001
                      licensePlate: "51A-67890"
                      brand: Hyundai
                      model: Accent
                      status: ACTIVE

        '400':
          description: VehicleType được cung cấp không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: INVALID_VEHICLE_TYPE
                message: Vehicle type is invalid

        '401':
          description: Customer chưa đăng nhập hoặc token không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: UNAUTHORIZED
                message: Authentication is required

        '403':
          description: Tài khoản hiện tại không phải Customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: FORBIDDEN
                message: Only customers can view available drivers

        '404':
          description: Không tìm thấy VehicleType.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: VEHICLE_TYPE_NOT_FOUND
                message: Vehicle type not found

        '500':
          description: Lỗi hệ thống.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: INTERNAL_SERVER_ERROR
                message: An unexpected error occurred

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AvailableDriver:
      type: object
      properties:
        driverId:
          type: string
          example: DRV001

        fullName:
          type: string
          example: Tran Van B

        availabilityStatus:
          type: string
          enum:
            - AVAILABLE
          example: AVAILABLE

        vehicle:
          $ref: '#/components/schemas/Vehicle'

    Vehicle:
      type: object
      properties:
        vehicleId:
          type: string
          example: VEH001

        vehicleTypeId:
          type: string
          example: VT001

        licensePlate:
          type: string
          example: "51A-12345"

        brand:
          type: string
          example: Toyota

        model:
          type: string
          example: Vios

        status:
          type: string
          example: ACTIVE

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: INVALID_VEHICLE_TYPE

        message:
          type: string
          example: Vehicle type is invalid

openapi: 3.0.3

info:
  title: Trip History API
  version: 1.0.0
  description: >
    API dùng để xem lịch sử các chuyến đi của người dùng
    trong hệ thống CAB.

servers:
  - url: http://localhost:3000/api
    description: Local development server

paths:
  /users/me/trips:
    get:
      tags:
        - Trips

      summary: Xem lịch sử chuyến đi

      description: >
        Cho phép người dùng xem danh sách các Trip đã tạo hoặc đã thực hiện,
        bao gồm thông tin cơ bản về chuyến đi, trạng thái và cước phí.

      security:
        - bearerAuth: []

      parameters:
        - name: page
          in: query
          required: false
          description: Số trang cần xem
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: pageSize
          in: query
          required: false
          description: Số Trip trên mỗi trang
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

      responses:

        '200':
          description: Lấy lịch sử chuyến đi thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: integer
                    example: 1

                  pageSize:
                    type: integer
                    example: 20

                  totalItems:
                    type: integer
                    example: 2

                  trips:
                    type: array
                    items:
                      type: object
                      properties:
                        tripId:
                          type: string
                          example: TRIP001

                        pickupLocation:
                          type: string
                          example: 1 Vo Van Ngan, Thu Duc, Ho Chi Minh City

                        destinationLocation:
                          type: string
                          example: Ben Thanh Market, Ho Chi Minh City

                        driverName:
                          type: string
                          nullable: true
                          example: Nguyen Van B

                        status:
                          type: string
                          example: COMPLETED

                        finalFare:
                          type: number
                          format: double
                          nullable: true
                          example: 85000

                        createdAt:
                          type: string
                          format: date-time
                          example: "2026-09-13T14:00:00+07:00"

        '401':
          description: Người dùng chưa đăng nhập hoặc token không hợp lệ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Người dùng chưa được xác thực

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

openapi: 3.0.3

info:
  title: Update Driver Location API
  description: >
    API cho phép Driver cập nhật vị trí hiện tại của mình
    trong CAB System.
    API này đáp ứng Functional Requirement FR09.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server

tags:
  - name: Driver
    description: Các API liên quan đến Driver.

paths:
  /drivers/me/location:
    put:
      tags:
        - Driver
      summary: Cập nhật vị trí hiện tại của Driver
      description: >
        Driver đã đăng nhập gửi tọa độ latitude và longitude.
        Hệ thống ghi nhận vị trí hiện tại của Driver.
      operationId: updateDriverLocation

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDriverLocationRequest'
            example:
              latitude: 10.8231
              longitude: 106.6297

      responses:
        '200':
          description: Cập nhật vị trí Driver thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverLocationResponse'
              example:
                locationId: LOC001
                driverId: DRV001
                latitude: 10.8231
                longitude: 106.6297
                recordedAt: "2026-09-17T15:30:00Z"
                message: Driver location updated successfully

        '400':
          description: Dữ liệu vị trí không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: INVALID_LOCATION
                message: Location information is invalid

        '401':
          description: Người dùng chưa đăng nhập hoặc token không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: UNAUTHORIZED
                message: Authentication is required

        '403':
          description: Tài khoản hiện tại không phải Driver.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: FORBIDDEN
                message: Only drivers can update location

        '404':
          description: Không tìm thấy Driver.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: DRIVER_NOT_FOUND
                message: Driver not found

        '500':
          description: Lỗi hệ thống.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: INTERNAL_SERVER_ERROR
                message: An unexpected error occurred

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UpdateDriverLocationRequest:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 10.8231

        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 106.6297

    DriverLocationResponse:
      type: object
      properties:
        locationId:
          type: string
          example: LOC001

        driverId:
          type: string
          example: DRV001

        latitude:
          type: number
          format: double
          example: 10.8231

        longitude:
          type: number
          format: double
          example: 106.6297

        recordedAt:
          type: string
          format: date-time
          example: "2026-09-17T15:30:00Z"

        message:
          type: string
          example: Driver location updated successfully

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: INVALID_LOCATION

        message:
          type: string
          example: Location information is invalid

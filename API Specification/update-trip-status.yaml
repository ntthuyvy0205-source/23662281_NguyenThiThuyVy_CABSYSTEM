openapi: 3.0.3

info:
  title: Update Trip Status API
  version: 1.0.0
  description: >
    API dùng để Driver cập nhật trạng thái của một chuyến đi
    trong quá trình thực hiện Trip của hệ thống CAB.

servers:
  - url: http://localhost:3000/api
    description: Local development server

paths:
  /trips/{tripId}/status:
    patch:
      tags:
        - Trips

      summary: Cập nhật trạng thái chuyến đi

      description: >
        Cho phép Driver cập nhật trạng thái của Trip theo tiến trình
        thực tế như đã đến điểm đón, đã đón Customer,
        bắt đầu chuyến đi hoặc hoàn thành chuyến đi.

      security:
        - bearerAuth: []

      parameters:
        - name: tripId
          in: path
          required: true
          description: ID của chuyến đi cần cập nhật trạng thái
          schema:
            type: string
          example: TRIP001

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object

              required:
                - status

              properties:
                status:
                  type: string
                  description: Trạng thái mới của Trip
                  enum:
                    - DRIVER_ARRIVED
                    - PASSENGER_PICKED_UP
                    - IN_PROGRESS
                    - COMPLETED
                  example: DRIVER_ARRIVED

      responses:

        '200':
          description: Cập nhật trạng thái Trip thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  tripId:
                    type: string
                    example: TRIP001

                  status:
                    type: string
                    example: DRIVER_ARRIVED

                  updatedAt:
                    type: string
                    format: date-time
                    example: "2026-09-13T16:30:00+07:00"

                  message:
                    type: string
                    example: Cập nhật trạng thái chuyến đi thành công

        '400':
          description: Trạng thái được gửi không hợp lệ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Trạng thái Trip không hợp lệ

        '401':
          description: Driver chưa đăng nhập hoặc token không hợp lệ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Người dùng chưa được xác thực

        '403':
          description: Người dùng không có quyền cập nhật Trip này
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Bạn không có quyền cập nhật chuyến đi này

        '404':
          description: Không tìm thấy Trip
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Không tìm thấy chuyến đi

        '409':
          description: Chuyển trạng thái Trip không hợp lệ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Không thể chuyển sang trạng thái được yêu cầu

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
